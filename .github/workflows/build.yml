name: Build wkdmod APK (Xiaomi arm64-v8a)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      DEVX_VERSION: 1.5.4  # Wersja z fixem na high refresh rate [citation:10][citation:12]
      NDK_VERSION: 25.2.9519653
      ANDROID_API: 33
      ANDROID_DIR: android-project
      TARGET_ABI: arm64-v8a

    steps:
      - name: Checkout wkdmod source
        uses: actions/checkout@v4
        with:
          repository: wkdgmr/wkdmod
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools"           >> $GITHUB_PATH

      - name: Install NDK, build-tools, CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "ndk;${NDK_VERSION}" \
                    "build-tools;33.0.2" \
                    "platforms;android-${ANDROID_API}" \
                    "cmake;3.22.1"

      - name: Create local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK"                       >  "${ANDROID_DIR}/local.properties"
          echo "ndk.dir=$SDK/ndk/${NDK_VERSION}"    >> "${ANDROID_DIR}/local.properties"

      - name: Patch ABI to arm64-v8a only
        run: |
          GRADLE_FILE="${ANDROID_DIR}/app/build.gradle"
          sed -i -E "s/abiFilters[[:space:]]+'[^']*'([[:space:]]*,[[:space:]]*'[^']*')*/abiFilters '${TARGET_ABI}'/" "$GRADLE_FILE"
          grep -n "abiFilters" "$GRADLE_FILE"

      - name: Build APK (debug, arm64-v8a)
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains only arm64-v8a
        run: |
          APK=$(find "${ANDROID_DIR}" -path '*/build/outputs/apk/debug/*.apk' | head -1)
          unzip -l "$APK" | grep -E 'lib/' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wkdmod-xiaomi-arm64-v8a-debug-apk
          path: android-project/**/build/outputs/apk/debug/*.apk
