name: Build wkdmod APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 25.2.9519653
      ANDROID_API: 33
      ANDROID_DIR: android-project

    steps:
      - name: Checkout wkdmod source
        uses: actions/checkout@v4
        with:
          repository: wkdgmr/wkdmod
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools"           >> $GITHUB_PATH

      - name: Install NDK, build-tools, CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "ndk;${NDK_VERSION}" \
                    "build-tools;33.0.2" \
                    "platforms;android-${ANDROID_API}" \
                    "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK"                                  >  "${ANDROID_DIR}/local.properties"
          echo "ndk.dir=$SDK/ndk/${NDK_VERSION}"               >> "${ANDROID_DIR}/local.properties"
          cat "${ANDROID_DIR}/local.properties"

      - name: Generate Gradle wrapper (jeśli brak)
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          if [ ! -x "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build APK (debug, signed)
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wkdmod-debug-apk
          path: |
            android-project/**/build/outputs/apk/debug/*.apk
            android-project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
