name: Build wkdmod APK (armeabi-v7a)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 25.2.9519653
      ANDROID_API: 33
      ANDROID_DIR: android-project
      TARGET_ABI: armeabi-v7a

    steps:
      - name: Checkout wkdmod source
        uses: actions/checkout@v4
        with:
          repository: wkdgmr/wkdmod
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK/platform-tools"           >> $GITHUB_PATH

      - name: Install NDK, build-tools, CMake
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "ndk;${NDK_VERSION}" \
                    "build-tools;33.0.2" \
                    "platforms;android-${ANDROID_API}" \
                    "cmake;3.22.1"

      - name: Create local.properties
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK"                       >  "${ANDROID_DIR}/local.properties"
          echo "ndk.dir=$SDK/ndk/${NDK_VERSION}"    >> "${ANDROID_DIR}/local.properties"
          cat "${ANDROID_DIR}/local.properties"

      - name: Patch abiFilters to armeabi-v7a only
        run: |
          GRADLE_FILE="${ANDROID_DIR}/app/build.gradle"
          echo "=== przed patchem ==="
          grep -n "abiFilters" "$GRADLE_FILE" || true
          sed -i -E "s/abiFilters[[:space:]]+'[^']*'([[:space:]]*,[[:space:]]*'[^']*')*/abiFilters '${TARGET_ABI}'/" "$GRADLE_FILE"
          echo "=== po patchu ==="
          grep -n "abiFilters" "$GRADLE_FILE" || true

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-armv7-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.gradle*', env.ANDROID_DIR)) }}
          restore-keys: gradle-armv7-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-armv7-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-armv7-${{ runner.os }}-

      - name: Build APK (debug, armeabi-v7a)
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK contains only armeabi-v7a
        run: |
          APK=$(find "${ANDROID_DIR}" -path '*/build/outputs/apk/debug/*.apk' | head -1)
          echo "APK: $APK"
          echo "=== zawartość lib/ w APK ==="
          unzip -l "$APK" | grep -E 'lib/' || echo "(brak lib/)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wkdmod-armeabi-v7a-debug-apk
          path: |
            android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
