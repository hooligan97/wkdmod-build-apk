name: Build wkdmod APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: 25.2.9519653
      ANDROID_API: 33

    steps:
      - name: Checkout wkdmod source
        uses: actions/checkout@v4
        with:
          repository: wkdgmr/wkdmod
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK, build-tools, CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;${NDK_VERSION}" \
                     "build-tools;33.0.2" \
                     "platforms;android-${ANDROID_API}" \
                     "cmake;3.22.1"

      - name: Export SDK/NDK env
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK"     >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK"         >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}"  >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}"  >> $GITHUB_ENV

      - name: Create local.properties if Android project present
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "android" ]; then
            {
              echo "sdk.dir=$SDK"
              echo "ndk.dir=$SDK/ndk/${NDK_VERSION}"
            } > android/local.properties
            cat android/local.properties
          fi

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Build APK (debug, signed)
        run: |
          if [ -x "android/gradlew" ]; then
            cd android
            ./gradlew --no-daemon assembleDebug
          elif [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            echo "Brak gradlew — to repo nie zawiera buildu Android."
            find . -maxdepth 3 -name "*.gradle*" -o -name "Android.mk" -o -name "CMakeLists.txt" | head -50
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wkdmod-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
